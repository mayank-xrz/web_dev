<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Student Profile System</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: Arial, sans-serif;
    margin: 0;
    background: #f4f4f4;
    color: #222;
  }
  header {
    background: #222;
    color: #fff;
    text-align: center;
    padding: 20px;
    font-size: 24px;
    font-weight: bold;
  }
  nav {
    background: #444;
    display: flex;
    justify-content: center;
  }
  nav a {
    color: #fff;
    text-decoration: none;
    padding: 14px 22px;
    border-right: 1px solid #666;
  }
  nav a:last-child { border-right: none; }
  nav a:hover { background: #666; }

  main {
    max-width: 800px;
    margin: 20px auto;
    padding: 0 15px;
  }

  .profile-section {
    display: flex;
    gap: 20px;
    flex-wrap: wrap;
    margin-bottom: 25px;
  }
  .profile-image {
    width: 150px;
    height: 150px;
    background: #ddd;
    border: 1px solid #999;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #555;
    border-radius: 6px;
  }
  .student-info {
    flex: 1;
    min-width: 200px;
    border: 1px solid #ccc;
    border-radius: 6px;
    padding: 15px;
    background: #fff;
  }
  .student-info h2 {
    margin-top: 0;
    font-size: 18px;
    border-bottom: 1px solid #ddd;
    padding-bottom: 8px;
  }
  .student-info p { margin: 6px 0; }

  table {
    width: 100%;
    border-collapse: collapse;
    background: #fff;
    margin-bottom: 20px;
  }
  table caption {
    font-weight: bold;
    padding: 10px;
    background: #eee;
  }
  th, td {
    border: 1px solid #ccc;
    padding: 10px;
    text-align: center;
  }
  th { background: #f0f0f0; }

  aside {
    background: #fff3cd;
    border: 1px solid #ffe08a;
    padding: 12px;
    border-radius: 6px;
    margin-bottom: 20px;
    font-weight: bold;
  }

  footer {
    background: #222;
    color: #fff;
    text-align: center;
    padding: 15px;
  }
</style>
</head>
<body>

<header>
  Student Profile System
</header>

<nav>
  <a href="#">Home</a>
  <a href="#">About</a>
  <a href="#">Courses</a>
  <a href="#">Content</a>
</nav>

<main>
  <div class="profile-section">
    <div class="profile-image">Image</div>
    <div class="student-info">
      <h2>Student Info</h2>
      <p><strong>Name:</strong> Rahul</p>
      <p><strong>Course:</strong> CS</p>
      <p><strong>Year:</strong> 1st Year</p>
    </div>
  </div>

  <table>
    <caption>Table</caption>
    <thead>
      <tr>
        <th>Subject</th>
        <th>Marks</th>
        <th>Grade</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td>HTML</td>
        <td>85</td>
        <td>A</td>
      </tr>
      <tr>
        <td>CSS</td>
        <td>90</td>
        <td>A+</td>
      </tr>
      <tr>
        <td>SS</td>
        <td>80</td>
        <td>A</td>
      </tr>
    </tbody>
  </table>

  <aside>
    Upcoming: Web Dev Exam
  </aside>
</main>

<footer>
  &copy; 2026 BST College
</footer>

</body>
</html>
