<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Student Marks Table</title>
    <style>
        table {
            border-collapse: collapse;
            width: 60%;
            margin: 20px auto;
        }
        th, td {
            border: 1px solid #333;
            padding: 8px 12px;
            text-align: center;
        }
        caption {
            font-size: 1.2em;
            font-weight: bold;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <h1 style="text-align:center;">Semester Marks Report</h1>

    <table>
        <caption>Student Marks Summary</caption>
        <tr>
            <th>Roll No</th>
            <th>Student Name</th>
            <th>HTML</th>
            <th>CSS</th>
            <th>Total</th>
            <th>Result</th>
        </tr>
        <tr>
            <td>101</td>
            <td>Rahul</td>
            <td>85</td>
            <td>78</td>
            <td>163</td>
            <td>Pass</td>
        </tr>
        <tr>
            <td>102</td>
            <td>Priya</td>
            <td>92</td>
            <td>88</td>
            <td>180</td>
            <td>Pass</td>
        </tr>
        <tr>
            <td>103</td>
            <td>Arjun</td>
            <td>65</td>
            <td>42</td>
            <td>107</td>
            <td>Pass</td>
        </tr>
        <tr>
            <td>104</td>

            <td>Fail</td>
        </tr>
    </table>
</body>
</html>
